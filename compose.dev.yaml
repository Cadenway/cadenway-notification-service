# Dependencies of cadenway-notification-service for working on it alone: its own PostgreSQL database,
# NATS JetStream with the streams of cadenway-ops, and Mailpit for the e-mails. The service itself
# runs on the host with `pnpm start:dev`; the integration specs of tests/ start this file as
# throwaway projects.
#
# The credentials below are local development values, matching .env.example. PostgreSQL has the two
# roles of cadenway-ops (docs/database.md there): notification_migrator owns the database and runs
# the DDL; notification_app runs the service, owns nothing, reads and writes the rows of the
# `public` schema only, and is subject to row-level security. The roles are created when the data
# volume is empty: after pulling this change, recreate an older volume once with
# `docker compose -f compose.dev.yaml down --volumes`.
#
# NATS runs with the authorization of the broker of cadenway-ops (docs/messaging.md and
# compose/nats/nats-server.conf there): a connection without a user is refused, and the
# `notification` user has the same permissions as there. It publishes the subjects of the entities
# this service owns and the dead letters (`dlq.>`), reads EVENTS and EVENTS_RESTRICTED through
# consumers and by sequence (`STREAM.MSG.GET`, for the dead-letter worker), receives the four
# delivery advisories of those two streams, and subscribes to its own inbox prefix
# `_INBOX.notification.>` and to `rebuild.notification.>`. When cadenway-ops changes those
# permissions, change them here too. `admin` stands for the user of the `nats-streams` container of
# cadenway-ops; `identity`, with the permissions of identity-service there, publishes the restricted
# events the tests send to this service.
#
# The streams: `nats-streams` runs compose/nats/ensure-streams.sh of cadenway-ops, copied below, as
# `admin`, the way the `nats-streams` container of cadenway-ops does. It creates EVENTS,
# EVENTS_RESTRICTED and EVENTS_DLQ (or aligns them) once NATS is healthy, then checks every minute
# that they exist, and is healthy while they do, so `up --wait` returns once the streams are in
# place. A one-shot container would make `up --wait` fail when it exits. The service never creates a
# stream itself (`manageStreams: false`): with the dead-letter worker on, it refuses to start
# without any of the three.
name: cadenway-notification-service-dev

services:
  postgres:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    configs:
      - source: service-roles
        target: /docker-entrypoint-initdb.d/10-service-roles.sql
    ports:
      - '127.0.0.1:${DEV_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: during the first start the image runs the init scripts on a server that listens on
      # its socket only, so the roles exist once TCP answers.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d notification']
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.15.2-alpine@sha256:afae2fdbe2e326c65e1246cb83b9d05d319188734f3bd577ac8072daae78a10f
    command: ['--config', '/etc/nats/nats-server.conf']
    configs:
      - source: nats-server
        target: /etc/nats/nats-server.conf
    ports:
      - '127.0.0.1:${DEV_NATS_PORT:-4222}:4222'
    volumes:
      - nats-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz']
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every e-mail the service sends and asks for no account: SMTP on 1025, the messages on
  # http://localhost:8025 and its HTTP API. The image of the local stack of cadenway-ops.
  mailpit:
    image: axllent/mailpit:v1.29.0@sha256:0f93f36075f5f6fe428655d94299dda59b9a533d3fe9ce62909a72ac6fe455a9
    ports:
      - '127.0.0.1:${DEV_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${DEV_MAILPIT_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  nats-streams:
    image: natsio/nats-box:0.20.2-nonroot@sha256:d00bffed51ea1a29e58852698bde37020d306af55585882f88dbcf09dd86f5fe
    entrypoint: ['/bin/sh', '/etc/nats/ensure-streams.sh']
    environment:
      NATS_URL: nats://nats:4222
      NATS_USER: admin
      NATS_PASSWORD: admin
    configs:
      - source: ensure-streams
        target: /etc/nats/ensure-streams.sh
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'test', '-e', '/tmp/streams-ready']
      interval: 2s
      timeout: 3s
      retries: 15

configs:
  service-roles:
    content: |
      CREATE ROLE notification_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS
        PASSWORD 'notification_migrator';
      CREATE ROLE notification_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS
        PASSWORD 'notification_app';
      ALTER ROLE notification_migrator SET statement_timeout = '15min';
      ALTER ROLE notification_migrator SET lock_timeout = '5s';
      ALTER ROLE notification_migrator SET idle_in_transaction_session_timeout = '60s';
      ALTER ROLE notification_app SET statement_timeout = '10s';
      ALTER ROLE notification_app SET lock_timeout = '5s';
      ALTER ROLE notification_app SET idle_in_transaction_session_timeout = '30s';
      ALTER DATABASE notification OWNER TO notification_migrator;
      REVOKE ALL ON DATABASE notification FROM PUBLIC;
      GRANT CONNECT ON DATABASE notification TO notification_app;
      REVOKE CREATE ON SCHEMA public FROM PUBLIC;
      GRANT USAGE ON SCHEMA public TO notification_app;
      -- Rows, never structure, and only in `public`: the journal of drizzle-kit lives in the
      -- `drizzle` schema, which stays closed to the application role, as in cadenway-ops.
      ALTER DEFAULT PRIVILEGES FOR ROLE notification_migrator IN SCHEMA public
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO notification_app;
      ALTER DEFAULT PRIVILEGES FOR ROLE notification_migrator IN SCHEMA public
        GRANT USAGE, SELECT ON SEQUENCES TO notification_app;

  # `$$` is a literal `$` for Compose; the server reads the quoted `$JS...` subjects as they are.
  nats-server:
    content: |
      port: 4222
      http_port: 8222

      jetstream {
        store_dir: /data
      }

      authorization {
        users = [
          { user: admin, password: admin, permissions: { publish: ">", subscribe: ">" } }

          # The publisher of the restricted events, as in cadenway-ops: it may publish under
          # `restricted.>` and read the information of EVENTS_RESTRICTED, never consume it.
          {
            user: identity
            password: identity
            permissions: {
              publish: {
                allow: [
                  "evt.user.>", "evt.session.>", "evt.api-token.>",
                  "rebuild.*.user", "rebuild.*.session", "rebuild.*.api-token",
                  "restricted.>",
                  "$$JS.API.INFO", "$$JS.API.STREAM.NAMES",
                  "$$JS.API.STREAM.INFO.EVENTS", "$$JS.API.STREAM.INFO.EVENTS_RESTRICTED",
                  "$$JS.API.CONSUMER.CREATE.EVENTS.>", "$$JS.API.CONSUMER.DURABLE.CREATE.EVENTS.*",
                  "$$JS.API.CONSUMER.INFO.EVENTS.*", "$$JS.API.CONSUMER.MSG.NEXT.EVENTS.*",
                  "$$JS.ACK.EVENTS.>"
                ]
              }
              subscribe: { allow: ["_INBOX.identity.>", "rebuild.identity.>"] }
            }
          }

          # The only reader of EVENTS_RESTRICTED, and for that reason the owner of the dead-letter
          # worker: the worker reads a failed message by its sequence and copies it under `dlq.>`, and a
          # failed message may be a restricted one.
          {
            user: notification
            password: notification
            permissions: {
              publish: {
                allow: [
                  "evt.notification.>", "evt.reminder.>",
                  "rebuild.*.notification", "rebuild.*.reminder",
                  "dlq.>",
                  "$$JS.API.INFO", "$$JS.API.STREAM.NAMES",
                  "$$JS.API.STREAM.INFO.EVENTS", "$$JS.API.STREAM.INFO.EVENTS_RESTRICTED",
                  "$$JS.API.STREAM.INFO.EVENTS_DLQ",
                  "$$JS.API.STREAM.MSG.GET.EVENTS", "$$JS.API.STREAM.MSG.GET.EVENTS_RESTRICTED",
                  "$$JS.API.CONSUMER.CREATE.EVENTS.>", "$$JS.API.CONSUMER.DURABLE.CREATE.EVENTS.*",
                  "$$JS.API.CONSUMER.INFO.EVENTS.*", "$$JS.API.CONSUMER.MSG.NEXT.EVENTS.*",
                  "$$JS.ACK.EVENTS.>",
                  "$$JS.API.CONSUMER.CREATE.EVENTS_RESTRICTED.>",
                  "$$JS.API.CONSUMER.DURABLE.CREATE.EVENTS_RESTRICTED.*",
                  "$$JS.API.CONSUMER.INFO.EVENTS_RESTRICTED.*",
                  "$$JS.API.CONSUMER.MSG.NEXT.EVENTS_RESTRICTED.*",
                  "$$JS.ACK.EVENTS_RESTRICTED.>"
                ]
              }
              subscribe: {
                allow: [
                  "_INBOX.notification.>", "rebuild.notification.>",
                  "$$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.EVENTS.>",
                  "$$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.EVENTS_RESTRICTED.>",
                  "$$JS.EVENT.ADVISORY.CONSUMER.MSG_TERMINATED.EVENTS.>",
                  "$$JS.EVENT.ADVISORY.CONSUMER.MSG_TERMINATED.EVENTS_RESTRICTED.>"
                ]
              }
            }
          }
        ]
      }

  # compose/nats/ensure-streams.sh of cadenway-ops, with `$$` for each `$`; keep the two aligned.
  ensure-streams:
    content: |
      set -eu

      readonly READY=/tmp/streams-ready
      readonly CHECK_INTERVAL=60
      readonly RETRY_INTERVAL=5

      # Creates a stream, or updates it when it exists.
      # Arguments: name, subjects, maximum age, maximum size in bytes, description.
      ensure_stream() {
        name=$$1
        subjects=$$2
        max_age=$$3
        max_bytes=$$4
        description=$$5

        if nats stream info "$$name" >/dev/null 2>&1; then
          nats stream edit "$$name" --force \
            --subjects "$$subjects" --description "$$description" \
            --max-age "$$max_age" --max-bytes "$$max_bytes" --dupe-window 2m >/dev/null
        else
          nats stream add "$$name" --defaults \
            --subjects "$$subjects" --description "$$description" \
            --storage file --retention limits --discard old --replicas 1 \
            --max-age "$$max_age" --max-bytes "$$max_bytes" --dupe-window 2m \
            --max-msgs=-1 --max-msgs-per-subject=-1 --max-msg-size=-1 >/dev/null
        fi
      }

      ensure_streams() {
        ensure_stream EVENTS 'evt.>' 7d 1GiB \
          'Every Cadenway event.' &&
          ensure_stream EVENTS_RESTRICTED 'restricted.>' 7d 64MiB \
            'Identity events carrying a single-use code or link; read by notification-service only.' &&
          ensure_stream EVENTS_DLQ 'dlq.>' 30d 256MiB \
            'Messages a consumer gave up on, copied by the dead-letter worker.'
      }

      streams_exist() {
        nats stream info EVENTS >/dev/null 2>&1 &&
          nats stream info EVENTS_RESTRICTED >/dev/null 2>&1 &&
          nats stream info EVENTS_DLQ >/dev/null 2>&1
      }

      # `sleep` runs in the background so the shell, as process 1, answers the stop signal at once.
      trap 'exit 0' TERM INT
      pause() {
        sleep "$$1" &
        wait $$!
      }

      rm -f "$$READY"
      while :; do
        if [ -e "$$READY" ] && streams_exist; then
          pause "$$CHECK_INTERVAL"
        elif ensure_streams; then
          echo 'nats-streams: EVENTS, EVENTS_RESTRICTED and EVENTS_DLQ are in place.'
          : >"$$READY"
          pause "$$CHECK_INTERVAL"
        else
          rm -f "$$READY"
          echo 'nats-streams: the streams are not in place yet; trying again.' >&2
          pause "$$RETRY_INTERVAL"
        fi
      done

volumes:
  postgres-data:
  nats-data:
